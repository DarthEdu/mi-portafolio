<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio Minimalista</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light"> <!-- Modo oscuro base -->

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Portafolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation" title="Menu">
                <span class="button-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#sobre-mi">Sobre mí</a></li>
                    <li class="nav-item"><a class="nav-link" href="#skills">Habilidades</a></li>
                    <li class="nav-item"><a class="nav-link" href="#proyectos">Proyectos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#certificados">Certificados</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <!-- Sobre mí -->
        <section id="sobre-mi" class="mb-5 pt-4">
            <h1 class="display-4 fw-bold mb-3">Hola, soy [Tu Nombre]</h1>
            <p class="lead text-secondary w-75">Soy un desarrollador enfocado en crear experiencias web rápidas, accesibles y con un diseño minimalista.</p>
        </section>

        <!-- Contenedores dinámicos para JavaScript -->
        <section id="skills" class="mb-5 pt-4">
            <h2 class="mb-4">Habilidades</h2>
            <div class="row g-4" id="skills-container"></div>
        </section>

        <section id="proyectos" class="mb-5 pt-4">
            <h2 class="mb-4">Proyectos</h2>
            <div class="row g-4" id="proyectos-container"></div>
        </section>

        <section id="certificados" class="mb-5 pt-4">
            <h2 class="mb-4">Certificados</h2>
            <div class="row g-4" id="certificados-container">
                <!-- Se inyectarán desde Credly vía JS -->
            </div>
        </section>
    </main>

    <!-- Footer / Contacto -->
    <footer id="contacto" class="bg-black py-5 mt-5 border-top border-secondary">
        <div class="container text-center">
            <h2 class="h4 mb-4">Hablemos</h2>
            <div class="d-flex justify-content-center gap-4 fs-3">
                <a href="TU_URL_INSTAGRAM" target="_blank" title="Instagram" aria-label="Instagram" class="text-light text-decoration-none hover-opacity"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
                <a href="TU_URL_GITHUB" target="_blank" title="GitHub" aria-label="GitHub" class="text-light text-decoration-none hover-opacity"><i class="fa-brands fa-github"></i></a>
                <a href="TU_URL_LINKEDIN" target="_blank" title="LinkedIn" aria-label="LinkedIn" class="text-light text-decoration-none hover-opacity"><i class="fa-brands fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
